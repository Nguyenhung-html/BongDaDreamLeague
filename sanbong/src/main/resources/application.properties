spring.application.name=sanbong

# 1. Thông tin kết nối SQL Server
# (QuanLySanBong là tên database bạn đã tạo trong script)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLySanBong;encrypt=true;trustServerCertificate=true;

# Username/password lấy từ biến môi trường, nếu không có thì dùng giá trị mặc định.
# Khi chạy máy khác chỉ cần đặt biến DB_USERNAME / DB_PASSWORD, không phải sửa file này.
#   Windows (PowerShell): $env:DB_PASSWORD="matkhau-cua-ban"
#   Linux/macOS:          export DB_PASSWORD="matkhau-cua-ban"
spring.datasource.username=sa
spring.datasource.password=123

# 2. Cấu hình JPA / Hibernate cho SQL Server
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
